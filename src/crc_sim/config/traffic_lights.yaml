# Traffic light schedule for the practice track.
# Generated by the Organising Committee; the graded track differs.
#
# id     : name used in the topic /traffic_light/<id>/state
# model  : Gazebo model name, see worlds/lights.gen.xacro
# range  : at every phase change the duration is drawn at random
#          from this interval, in seconds. Lights run independently
#          of each other and are not synchronised.

lights:
  - id: tl_j44_w
    model: tl_j44_w
    range: {green: [4.0, 9.0], yellow: [2.0, 2.0], red: [5.0, 12.0]}
